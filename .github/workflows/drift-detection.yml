name: Drift Detection

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  issues: write

env:
  TF_VERSION: "1.7.5"
  AWS_REGION: "eu-north-1"

jobs:
  detect-drift:
    name: "Detect drift (${{ matrix.scope }})"
    runs-on: ubuntu-latest
    concurrency:
      group: terraform-${{ matrix.scope }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        # Bootstrap is applied manually with operator credentials and is
        # intentionally excluded from this matrix — the CI role has no
        # permissions to plan the bootstrap stack.
        include:
          - scope: staging
            working_directory: infra/terraform/environments/staging
            role_var: TF_ROLE_ARN_STAGING
          - scope: prod
            working_directory: infra/terraform/environments/prod
            role_var: TF_ROLE_ARN_PROD
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars[matrix.role_var] }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        working-directory: ${{ matrix.working_directory }}
        run: terraform init -input=false

      - name: Terraform plan (drift check)
        id: plan
        working-directory: ${{ matrix.working_directory }}
        shell: bash
        run: |
          set +e
          terraform plan -input=false -no-color -detailed-exitcode -out=tfplan 2>&1 | tee plan-output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "No drift detected"
            echo "has_drift=false" >> "$GITHUB_OUTPUT"
          elif [ "$EXIT_CODE" -eq 2 ]; then
            echo "Drift detected"
            echo "has_drift=true" >> "$GITHUB_OUTPUT"
          else
            echo "Terraform plan failed with exit code $EXIT_CODE"
            exit 1
          fi

      - name: Upload plan artifact
        if: steps.plan.outputs.has_drift == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: drift-plan-${{ matrix.scope }}
          path: ${{ matrix.working_directory }}/plan-output.txt
          retention-days: 7

      - name: Create drift issue
        if: steps.plan.outputs.has_drift == 'true'
        uses: actions/github-script@v7
        env:
          PLAN_OUTPUT_PATH: ${{ matrix.working_directory }}/plan-output.txt
          DRIFT_SCOPE: ${{ matrix.scope }}
        with:
          script: |
            const fs = require('fs');
            const planOutput = fs.readFileSync(process.env.PLAN_OUTPUT_PATH, 'utf8');
            const truncated = planOutput.length > 60000
              ? planOutput.slice(0, 60000) + '\n\n... (truncated)'
              : planOutput;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const scope = process.env.DRIFT_SCOPE;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `IaC drift detected in ${scope}`,
              labels: ['ops', 'drift'],
              body: [
                `## Infrastructure drift detected`,
                '',
                `**Scope:** ${scope}`,
                `**Detected at:** ${new Date().toISOString()}`,
                `**Workflow run:** [View run](${runUrl})`,
                '',
                '### Terraform plan output',
                '',
                '```',
                truncated,
                '```',
                '',
                'Review the plan output and either apply the expected changes or investigate the drift.',
              ].join('\n'),
            });

  # The terraform plan above cannot cover the ci-terraform role: it is declared
  # in infra/terraform/bootstrap, which the CI role has no permission to read
  # (#289), and which CI never applies. So that role is the one piece of
  # infrastructure with nothing reconciling it — the live policy is whatever an
  # operator last applied by hand, and it is discovered to have lagged only when
  # a workflow calls an API it no longer grants. For verify-staging that surfaces
  # as an AccessDenied mid-promotion, blocking every production apply.
  #
  # Bootstrap still cannot be planned here. But the role can read its own inline
  # policies, and that is enough to check the calls the workflows actually make.
  ci-role-permissions:
    name: "Check CI role permissions (${{ matrix.scope }})"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - scope: staging
            role_var: TF_ROLE_ARN_STAGING
          - scope: prod
            role_var: TF_ROLE_ARN_PROD
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars[matrix.role_var] }}
          aws-region: ${{ env.AWS_REGION }}

      # Derived from the assumed identity rather than configured separately, so
      # this cannot drift from the role the deploy workflows actually use.
      - name: Resolve the assumed role
        id: role
        run: |
          IDENTITY=$(aws sts get-caller-identity --query '[Arn,Account]' --output text)
          # arn:aws:sts::<account>:assumed-role/<role>/<session>
          ROLE=$(echo "$IDENTITY" | cut -f1 | cut -d/ -f2)
          ACCOUNT=$(echo "$IDENTITY" | cut -f2)
          if [ -z "$ROLE" ] || [ -z "$ACCOUNT" ]; then
            echo "::error::Could not resolve a role and account from the assumed identity '$IDENTITY'."
            exit 1
          fi
          echo "Assumed $IDENTITY"
          echo "name=$ROLE" >> "$GITHUB_OUTPUT"
          echo "account=$ACCOUNT" >> "$GITHUB_OUTPUT"

      # Deliberately does not exit non-zero: a role that cannot read its own
      # policy is the drift this job exists to report, so it has to reach the
      # issue step rather than abort the job before it.
      - name: Fetch the live inline policy
        id: policy
        env:
          ROLE_NAME: ${{ steps.role.outputs.name }}
        run: |
          if aws iam get-role-policy --role-name "$ROLE_NAME" \
               --policy-name terraform-resources --output json > live-policy.json 2> fetch-error.txt; then
            echo "readable=true" >> "$GITHUB_OUTPUT"
          else
            echo "readable=false" >> "$GITHUB_OUTPUT"
            cat fetch-error.txt
          fi

      - name: Check the workflows' AWS calls against it
        id: check
        if: steps.policy.outputs.readable == 'true'
        env:
          ROLE_NAME: ${{ steps.role.outputs.name }}
          ACCOUNT_ID: ${{ steps.role.outputs.account }}
        run: |
          set +e
          node scripts/check-ci-role-permissions.mjs \
            --policy live-policy.json --role "$ROLE_NAME" \
            --account "$ACCOUNT_ID" --region "$AWS_REGION" 2>&1 | tee check-output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          # 2 is a usage error — the job invoked the script wrongly, which is a
          # bug here rather than drift in the role. Do not file it as drift.
          if [ "$EXIT_CODE" -eq 2 ]; then
            echo "::error::check-ci-role-permissions.mjs rejected its arguments; this is a bug in this workflow, not role drift."
            exit 1
          fi
          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "has_gap=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_gap=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Report a permissions gap
        if: steps.policy.outputs.readable == 'false' || steps.check.outputs.has_gap == 'true'
        uses: actions/github-script@v7
        env:
          DRIFT_SCOPE: ${{ matrix.scope }}
          ROLE_NAME: ${{ steps.role.outputs.name }}
          POLICY_READABLE: ${{ steps.policy.outputs.readable }}
        with:
          script: |
            const fs = require('fs');
            const scope = process.env.DRIFT_SCOPE;
            const role = process.env.ROLE_NAME;
            const readable = process.env.POLICY_READABLE === 'true';
            const readFile = (p) => { try { return fs.readFileSync(p, 'utf8'); } catch { return '(no output)'; } };
            const detail = readable ? readFile('check-output.txt') : readFile('fetch-error.txt');
            const truncated = detail.length > 60000 ? detail.slice(0, 60000) + '\n\n... (truncated)' : detail;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `CI role permissions lag bootstrap in ${scope}`;

            const body = [
              readable
                ? `## The live CI role is missing a permission the workflows use`
                : `## The live CI role could not be read`,
              '',
              `**Scope:** ${scope}`,
              `**Role:** \`${role}\``,
              `**Detected at:** ${new Date().toISOString()}`,
              `**Workflow run:** [View run](${runUrl})`,
              '',
              readable
                ? 'CI never applies `infra/terraform/bootstrap`, so this role is not reconciled by any pipeline.'
                : 'Reading `terraform-resources` on this role failed. If the cause is AccessDenied then `iam:GetRolePolicy` itself has lagged, which is the same drift one step earlier; a throttle or a transient IAM error would also land here, so check the message below before applying.',
              '',
              'Fix by applying bootstrap with operator credentials — CI cannot:',
              '',
              '```',
              'terraform -chdir=infra/terraform/bootstrap init',
              'terraform -chdir=infra/terraform/bootstrap apply',
              '```',
              '',
              readable ? '### Check output' : '### Error',
              '',
              '```',
              truncated,
              '```',
            ].join('\n');

            // This condition is sticky — it stays true until an operator runs a
            // manual apply — so a new issue every morning would be noise.
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'drift', per_page: 100,
            });
            const open = existing.data.find((issue) => issue.title === title);
            if (open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open.number, body,
              });
              core.notice(`Still failing; commented on #${open.number}.`);
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, labels: ['ops', 'drift'], body,
              });
            }

      # After the issue exists, so a red job never costs the report.
      - name: Fail if the role could not be verified
        if: steps.policy.outputs.readable == 'false' || steps.check.outputs.has_gap == 'true'
        run: |
          echo "::error::The ${{ matrix.scope }} ci-terraform role does not match what the workflows need. See the issue filed by this run."
          exit 1
