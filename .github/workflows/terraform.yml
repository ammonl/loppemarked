name: Terraform

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "infra/terraform/**"
  push:
    branches:
      - main
    paths:
      - "infra/terraform/**"

permissions:
  id-token: write
  contents: write
  pull-requests: write

env:
  TF_VERSION: "1.7.5"
  AWS_REGION: "eu-north-1"

jobs:
  # --------------- Pull Request: plan per environment ---------------

  plan-staging:
    name: "Plan (staging)"
    if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: terraform-staging
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TF_ROLE_ARN_STAGING }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        working-directory: infra/terraform/environments/staging
        run: terraform init -input=false

      - name: Terraform validate
        working-directory: infra/terraform/environments/staging
        run: terraform validate

      - name: Terraform plan
        working-directory: infra/terraform/environments/staging
        run: terraform plan -input=false -no-color -out=tfplan 2>&1 | tee plan-output.txt

      - name: Upload plan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-staging
          path: |
            infra/terraform/environments/staging/tfplan
            infra/terraform/environments/staging/plan-output.txt
          retention-days: 7

  plan-prod:
    name: "Plan (prod)"
    if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: terraform-prod
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TF_ROLE_ARN_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        working-directory: infra/terraform/environments/prod
        run: terraform init -input=false

      - name: Terraform validate
        working-directory: infra/terraform/environments/prod
        run: terraform validate

      - name: Terraform plan
        working-directory: infra/terraform/environments/prod
        run: terraform plan -input=false -no-color -out=tfplan 2>&1 | tee plan-output.txt

      - name: Upload plan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-prod
          path: |
            infra/terraform/environments/prod/tfplan
            infra/terraform/environments/prod/plan-output.txt
          retention-days: 7

  # --------------- Fork PRs: backend-disabled validate only ---------------

  validate-fork:
    name: "Validate (fork)"
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform fmt
        run: terraform fmt -check -recursive infra/terraform

      - name: Validate all environments (backend disabled)
        run: |
          for ENV_DIR in infra/terraform/environments/*; do
            if [ ! -d "$ENV_DIR" ]; then
              continue
            fi
            echo "--- Validating $ENV_DIR ---"
            terraform -chdir="$ENV_DIR" init -backend=false
            terraform -chdir="$ENV_DIR" validate
          done

  # --------------- Deploy pipeline: detect → apply staging → apply prod ---------------

  detect-staging:
    name: "Detect changes (staging)"
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    concurrency:
      group: terraform-staging
      cancel-in-progress: false
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TF_ROLE_ARN_STAGING }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        working-directory: infra/terraform/environments/staging
        run: terraform init -input=false

      - name: Terraform plan (detect changes)
        id: plan
        working-directory: infra/terraform/environments/staging
        shell: bash
        run: |
          set +e
          terraform plan -input=false -no-color -detailed-exitcode -out=tfplan 2>&1 | tee plan-output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "No changes detected"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          elif [ "$EXIT_CODE" -eq 2 ]; then
            echo "Changes detected"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "Terraform plan failed with exit code $EXIT_CODE"
            exit 1
          fi

      - name: Upload plan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-tfplan-staging
          path: |
            infra/terraform/environments/staging/tfplan
            infra/terraform/environments/staging/plan-output.txt
          retention-days: 7

  detect-prod:
    name: "Detect changes (prod)"
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    concurrency:
      group: terraform-prod
      cancel-in-progress: false
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TF_ROLE_ARN_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        working-directory: infra/terraform/environments/prod
        run: terraform init -input=false

      - name: Terraform plan (detect changes)
        id: plan
        working-directory: infra/terraform/environments/prod
        shell: bash
        run: |
          set +e
          terraform plan -input=false -no-color -detailed-exitcode -out=tfplan 2>&1 | tee plan-output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "No changes detected"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          elif [ "$EXIT_CODE" -eq 2 ]; then
            echo "Changes detected"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "Terraform plan failed with exit code $EXIT_CODE"
            exit 1
          fi

      - name: Upload plan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-tfplan-prod
          path: |
            infra/terraform/environments/prod/tfplan
            infra/terraform/environments/prod/plan-output.txt
          retention-days: 7

  apply-staging:
    name: "Apply (staging)"
    needs: detect-staging
    if: needs.detect-staging.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: terraform-staging
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TF_ROLE_ARN_STAGING }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        working-directory: infra/terraform/environments/staging
        run: terraform init -input=false

      - name: Download plan from detect job
        uses: actions/download-artifact@v4
        with:
          name: deploy-tfplan-staging
          path: infra/terraform/environments/staging

      - name: Terraform apply
        working-directory: infra/terraform/environments/staging
        run: terraform apply -input=false -no-color tfplan

  # A clean `terraform apply` means the API calls succeeded, not that the stack
  # still works. The failure worth catching is the apply Terraform reports as
  # successful that nonetheless leaves the Lambda unable to reach the database —
  # a security-group edit, a subnet change, an IAM narrowing. Without this job
  # that goes straight on to prod, and production is where you find out.
  verify-staging:
    name: "Verify (staging)"
    needs: apply-staging
    runs-on: ubuntu-latest
    # Resolves the environment-scoped API_FUNCTION_NAME. Deliberately no
    # `terraform-staging` concurrency group: this job takes no Terraform lock,
    # and that group only holds one pending entrant, so an unrelated
    # `infra/terraform/**` PR opening mid-deploy would cancel a queued verify
    # and block the promotion for no reason.
    environment: staging
    timeout-minutes: 10
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TF_ROLE_ARN_STAGING }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get Function URL
        id: url
        env:
          API_FUNCTION_NAME: ${{ vars.API_FUNCTION_NAME }}
        run: |
          if [ -z "$API_FUNCTION_NAME" ]; then
            echo "::error::API_FUNCTION_NAME is unset for the staging environment, so staging cannot be verified."
            exit 1
          fi
          URL=$(aws lambda get-function-url-config \
            --function-name "$API_FUNCTION_NAME" \
            --query 'FunctionUrl' --output text)
          # `--output text` prints "None" rather than failing when the query
          # matches nothing. Catch that here: left to the smoke test it would
          # burn the whole retry budget and then blame the database.
          if [ -z "$URL" ] || [ "$URL" = "None" ]; then
            echo "::error::$API_FUNCTION_NAME has no Function URL config, so staging cannot be verified."
            exit 1
          fi
          echo "api_url=$URL" >> "$GITHUB_OUTPUT"

      # /public/status is unauthenticated, reads system_settings and counts
      # tables, so a 200 proves Lambda -> VPC/networking -> RDS end to end.
      # /health would not: it returns a static body without touching the
      # database, so it keeps answering through exactly the failures this job
      # exists to catch.
      - name: Smoke-test staging
        env:
          API_URL: ${{ steps.url.outputs.api_url }}
        run: |
          # A false negative here blocks the production deploy, so allow real
          # convergence time: a fresh apply can leave security-group and route
          # changes propagating for minutes, the security group is
          # create_before_destroy, and the first request pays a VPC cold start
          # on top. Failing requests return fast, so a short budget would be
          # spent long before the stack has settled.
          ATTEMPTS=10
          for ATTEMPT in $(seq 1 "$ATTEMPTS"); do
            # curl already reports 000 via -w when it fails; `|| STATUS=000`
            # (not `|| echo`, which would append a second 000 to the log) keeps
            # its non-zero exit from tripping `bash -e`.
            STATUS=$(curl -s -o /tmp/status-response.json -w '%{http_code}' --max-time 20 "${API_URL%/}/public/status") || STATUS=000
            echo "Attempt $ATTEMPT/$ATTEMPTS: HTTP $STATUS"
            if [ "$STATUS" = "200" ] && jq -e '.serverTime' /tmp/status-response.json > /dev/null 2>&1; then
              echo "Staging served a database-backed request:"
              cat /tmp/status-response.json
              exit 0
            fi
            rm -f /tmp/status-response.json
            if [ "$ATTEMPT" -lt "$ATTEMPTS" ]; then
              sleep 10
            fi
          done
          echo "::error::Staging did not serve a database-backed request after $ATTEMPTS attempts (last HTTP $STATUS); not promoting to prod."
          exit 1

  apply-prod:
    name: "Apply (prod)"
    needs: [detect-staging, detect-prod, apply-staging, verify-staging]
    # `!cancelled()` rather than `always()`: this gate has to keep holding when
    # an upstream job is skipped, but `always()` would also run it on a
    # deliberately cancelled run.
    #
    # The promote-without-staging path keys off detect-staging's own
    # `has_changes` rather than `apply-staging.result == 'skipped'`. A skipped
    # result means both "staging had nothing to apply" (promote) and "staging
    # never started" (do not promote); the output distinguishes them, and
    # detect-staging is already required to have succeeded.
    #
    # It tests `== 'false'` rather than `!= 'true'` so that an *unset* output
    # holds the promotion instead of opening it. detect-staging always publishes
    # one of the two values today, but if it ever succeeds without doing so —
    # a renamed step id, a broken `outputs:` mapping — `!= 'true'` would promote
    # a change staging never applied, which is the failure this gate exists to
    # stop. The siblings still carry the `!= 'true'` form; deliberate difference.
    if: >-
      !cancelled() &&
      needs.detect-prod.outputs.has_changes == 'true' &&
      needs.detect-prod.result == 'success' &&
      needs.detect-staging.result == 'success' &&
      (needs.detect-staging.outputs.has_changes == 'false' ||
      (needs.apply-staging.result == 'success' && needs.verify-staging.result == 'success'))
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: terraform-prod
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TF_ROLE_ARN_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        working-directory: infra/terraform/environments/prod
        run: terraform init -input=false

      - name: Download plan from detect job
        uses: actions/download-artifact@v4
        with:
          name: deploy-tfplan-prod
          path: infra/terraform/environments/prod

      - name: Terraform apply
        working-directory: infra/terraform/environments/prod
        run: terraform apply -input=false -no-color tfplan
